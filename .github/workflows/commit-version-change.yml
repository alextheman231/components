name: Commit a version change
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-major-version:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'alextheman231/components' }}
    uses: alextheman231/github-actions/.github/workflows/commit-version-change.yml@77ec4714869dc7574206ff9142a156dd8d49b671 # v12.7.5
    with:
      version-type: major
    secrets:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  check-minor-version:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'alextheman231/components' }}
    uses: alextheman231/github-actions/.github/workflows/commit-version-change.yml@77ec4714869dc7574206ff9142a156dd8d49b671 # v12.7.5
    with:
      version-type: minor
    secrets:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  check-patch-version:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'alextheman231/components' }}
    uses: alextheman231/github-actions/.github/workflows/commit-version-change.yml@77ec4714869dc7574206ff9142a156dd8d49b671 # v12.7.5
    with:
      version-type: patch
    secrets:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
